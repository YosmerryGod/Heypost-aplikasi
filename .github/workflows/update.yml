name: Publish HeyPost OTA Update

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "constants/**"
      - "hooks/**"
      - "lib/**"
      - "assets/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/update.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heypost-ota-preview
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish OTA
    runs-on: ubuntu-latest
    steps:
      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Repository secret EXPO_TOKEN is missing."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish Android update to preview channel
        run: eas update --branch preview --platform android --message "GitHub ${{ github.sha }}"
